{% extends "base.html" %}

{% block content %}
<div class="edit-profile-container">
    <h1>Редактирование профиля</h1>
    <form method="post" enctype="multipart/form-data" class="edit-form">
        <div class="form-group">
            <label>Email (не меняется)</label>
            <input type="email" value="{{ user.email }}" disabled>
        </div>

        <div class="form-group">
            <label for="nickname">Никнейм (уникальный)</label>
            <input type="text" id="nickname" name="nickname" value="{{ user.nickname }}" required minlength="3">
            <small>Минимум 3 символа. Будет виден всем пользователям.</small>
        </div>

        <div class="form-group">
            <label for="bio">О себе</label>
            <textarea id="bio" name="bio" rows="4" placeholder="Расскажите о себе, вашем опыте, интересах и профессиональных целях...">{{ user.bio or '' }}</textarea>
            <small>Поддерживается обычный текст. Максимум 500 символов.</small>
        </div>

        <div class="form-group">
            <label>Аватарка</label>
            {% if user.avatar %}
                <div class="current-avatar">
                    <img src="{{ url_for('static', filename='avatars/' + user.avatar) }}" alt="avatar" width="80" style="border-radius: 50%;">
                </div>
            {% endif %}
            <input type="file" name="avatar" accept="image/png, image/jpeg, image/jpg, image/gif">
            <small>Рекомендуемый размер: 200x200 пикселей.</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Сохранить изменения
            </button>
            <a href="{{ url_for('profile', user_id=user.id) }}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Отмена
            </a>
        </div>
    </form>
</div>

<style>
    .edit-profile-container {
        max-width: 700px;
        margin: 100px auto 40px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .edit-profile-container h1 {
        color: #1a3a6e;
        font-size: 28px;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid #0b9cb5;
    }
    .form-group {
        margin-bottom: 25px;
    }
    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1a3a6e;
    }
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font-size: 15px;
        transition: border-color 0.2s, box-shadow 0.2s;
        font-family: inherit;
    }
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #0b9cb5;
        box-shadow: 0 0 0 3px rgba(11,156,181,0.1);
    }
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    .form-group small {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        color: #64748b;
    }
    .current-avatar {
        margin-bottom: 12px;
    }
    .current-avatar img {
        border: 3px solid #0b9cb5;
        padding: 2px;
    }
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
    }
    .btn-primary, .btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 24px;
        border: none;
        border-radius: 40px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
        background: linear-gradient(135deg, #28b8d5, #1689a7);
        color: white;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(11,156,181,0.3);
    }
    .btn-secondary {
        background: #e2e8f0;
        color: #1a3a6e;
    }
    .btn-secondary:hover {
        background: #cbd5e1;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
