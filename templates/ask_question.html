{% extends "base.html" %}

{% block content %}
<div class="ask-question-container">
    <h1>Задать новый вопрос</h1>
    <form method="post" class="ask-form" id="ask-form">
        <div class="form-group">
            <label for="title">Заголовок</label>
            <input type="text" id="title" name="title" required placeholder="Кратко опишите суть вопроса">
        </div>
        <div class="form-group">
            <label for="content">Текст вопроса</label>
            <textarea id="content" name="content" rows="8" required placeholder="Подробно опишите вашу ситуацию..."></textarea>
        </div>
        <div class="form-group">
            <label>Теги (через запятую)</label>
            <div class="tags-input-container" id="tags-container">
                <div class="tags-list" id="tags-list"></div>
                <input type="text" id="tags-input" class="tags-input" placeholder="введите тег и нажмите запятую или Enter">
            </div>
            <input type="hidden" id="tags-hidden" name="tags">
            <small>Максимум 7 тегов, каждый до 20 символов. Нажмите запятую или Enter для добавления.</small>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Опубликовать вопрос</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<script>
    class TagsInput {
        constructor(containerId, hiddenInputId, maxTags = 7, maxTagLength = 20) {
            this.container = document.getElementById(containerId);
            this.tagsList = this.container.querySelector('.tags-list');
            this.textInput = this.container.querySelector('.tags-input');
            this.hiddenInput = document.getElementById(hiddenInputId);
            this.maxTags = maxTags;
            this.maxTagLength = maxTagLength;
            this.tags = [];
            this.init();
        }

        init() {
            this.textInput.addEventListener('keydown', (e) => this.handleKeyDown(e));
            this.textInput.addEventListener('blur', () => this.addCurrentTag());
        }

        showToast(message, type = 'error') {
            const toastContainer = document.getElementById('toast-container');
            if (toastContainer) {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            } else {
                alert(message);
            }
        }

        validateTag(tag) {
            if (!tag) return false;
            if (this.tags.includes(tag)) {
                this.showToast(`❌ Тег "${tag}" уже добавлен.`);
                return false;
            }
            if (tag.length > this.maxTagLength) {
                this.showToast(`❌ Тег "${tag}" длиннее ${this.maxTagLength} символов.`);
                return false;
            }
            if (this.tags.length >= this.maxTags) {
                this.showToast(`❌ Нельзя добавить больше ${this.maxTags} тегов.`);
                return false;
            }
            return true;
        }

        addTag(tag) {
            tag = tag.trim().toLowerCase();
            if (!tag) return false;
            if (!this.validateTag(tag)) return false;
            this.tags.push(tag);
            this.render();
            this.textInput.value = '';
            this.updateHiddenInput();
            return true;
        }

        removeTag(index) {
            this.tags.splice(index, 1);
            this.render();
            this.updateHiddenInput();
        }

        addCurrentTag() {
            const tag = this.textInput.value.trim();
            if (tag) this.addTag(tag);
        }

        handleKeyDown(e) {
            if (e.key === ',' || e.key === 'Enter') {
                e.preventDefault();
                this.addCurrentTag();
            } else if (e.key === 'Backspace' && this.textInput.value === '' && this.tags.length > 0) {
                this.removeTag(this.tags.length - 1);
            }
        }

        render() {
            this.tagsList.innerHTML = '';
            this.tags.forEach((tag, index) => {
                const tagElement = document.createElement('span');
                tagElement.className = 'dynamic-tag';
                tagElement.innerHTML = `${tag} <span class="tag-remove" data-index="${index}">×</span>`;
                this.tagsList.appendChild(tagElement);
            });
            document.querySelectorAll('.tag-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.dataset.index);
                    this.removeTag(index);
                });
            });
        }

        updateHiddenInput() {
            this.hiddenInput.value = this.tags.join(',');
        }

        getTags() {
            return this.tags;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const tagsInput = new TagsInput('tags-container', 'tags-hidden', 7, 20);
        document.getElementById('ask-form').addEventListener('submit', function(e) {
            if (tagsInput.getTags().length > 7) {
                tagsInput.showToast('❌ Нельзя добавить больше 7 тегов.');
                e.preventDefault();
                return false;
            }
            return true;
        });
    });
</script>
{% endblock %}
